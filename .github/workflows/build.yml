name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Create Android Project Structure
      run: |
        mkdir -p app/src/main/res
        echo 'plugins { id("com.android.application") id("org.jetbrains.kotlin.android") } android { namespace "com.example.calculator" compileSdk 34 defaultConfig { applicationId "com.example.calculator" minSdk 24 targetSdk 34 versionCode 1 versionName "1.0" } buildTypes { release { minifyEnabled false } } compileOptions { sourceCompatibility JavaVersion.VERSION_17 targetCompatibility JavaVersion.VERSION_17 } kotlinOptions { jvmTarget = "17" } buildFeatures { compose true } composeOptions { kotlinCompilerExtensionVersion "1.5.8" } } dependencies { implementation("androidx.core:core-ktx:1.12.0") implementation("androidx.activity:activity-compose:1.8.2") implementation(platform("androidx.compose:compose-bom:2023.10.01")) implementation("androidx.compose.ui:ui") implementation("androidx.compose.ui:ui-graphics") implementation("androidx.compose.ui:ui-tooling-preview") implementation("androidx.compose.material3:material3") }' > app/build.gradle
        echo 'include(":app")' > settings.gradle
        echo 'buildscript { dependencies { classpath("com.android.tools.build:gradle:8.2.2") classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22") } }' > build.gradle
        echo 'sdk.dir=/usr/local/android-sdk' > local.properties
        echo 'android.useAndroidX=true' > gradle.properties

    - name: Build APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Calculator-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        
